<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Orientado Pro - Offline Mapas</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22GPS%20Giro%22,%22short_name%22:%22GPSGiro%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22}">

    <link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; 
            font-family: -apple-system, system-ui, sans-serif; background-color: #000;
        }
        #map { height: 100%; width: 100%; }
        
        /* Panel de botones estilo iOS - En la parte inferior horizontal */
        .panel-botones {
            position: absolute; 
            bottom: calc(20px + env(safe-area-inset-bottom, 0px)); /* Optimizado para el "notch" de dispositivos móviles */
            left: 50%;
            transform: translateX(-50%); /* Centrado horizontal perfecto */
            z-index: 10;
            display: flex; 
            flex-direction: row; /* Alineación en fila */
            gap: 12px; /* Espacio equilibrado entre botones */
            justify-content: center;
            align-items: center;
            width: max-content; /* Se ajusta al tamaño exacto del grupo de botones */
        }
        .btn-ios {
            background: rgba(255, 255, 255, 0.95); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            border: none; border-radius: 50%; box-shadow: 0px 4px 12px rgba(0,0,0,0.35);
            font-size: 24px; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.1s ease;
        }
        .btn-ios:active { transform: scale(0.92); }
        .btn-activo { background: #007aff !important; color: white !important; }
        .input-oculto { display: none; }
        
        /* Contenedor del Perfil de Altitud */
        .panel-altitud {
            position: absolute; top: -100%; left: 0; width: 100%; height: 220px;
            background: rgba(255, 255, 255, 0.95); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            z-index: 15; border-bottom: 1px solid rgba(0,0,0,0.1);
            transition: top 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 15px; box-sizing: border-box;
            display: flex; flex-direction: column;
        }
        .panel-altitud.abierto { top: 0; }
        .contenedor-grafico { flex-grow: 1; position: relative; width: 100%; height: 100%; }

        /* Flecha GPS en CSS */
        .gpx-flecha-usuario {
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 28px solid #007aff;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.4));
            transition: transform 0.1s linear;
        }
    </style>
</head>
<body>

    <div id="panel-altitud" class="panel-altitud">
        <div class="contenedor-grafico">
            <canvas id="graficoAltitud"></canvas>
        </div>
    </div>

    <div id="map"></div>
    
    <div class="panel-botones">
        <button class="btn-ios" id="btn-capa" onclick="alternarCapa()">⛰️</button>
        <button class="btn-ios" id="btn-altitud" onclick="alternarPanelAltitud()">📊</button>
        
        <label for="file-input" class="btn-ios">📂</label>
        <input type="file" id="file-input" class="input-oculto" accept=".gpx">
        
        <label for="map-input" class="btn-ios" id="label-mapa">🗺️</label>
        <input type="file" id="map-input" class="input-oculto" accept=".pmtiles">

        <button class="btn-ios" id="btn-brujula" onclick="conmutarModoSeguimiento()">🧭</button>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>

    <script src="app.js"></script>
</body>
</html>
