<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visor GPX con Satélite</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Visor%20GPX%20Sat%22,%22short_name%22:%22VisorGPX%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22}")>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: #000;
        }
        #map { 
            height: 100%; 
            width: 100%; 
            z-index: 1; 
        }
        
        /* Panel de botones flotantes estilo iOS */
        .panel-botones {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn-ios {
            background: rgba(255, 255, 255, 0.95);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 50%;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.35);
            font-size: 24px;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .btn-ios:active { 
            transform: scale(0.92);
            background: #e5e5e5; 
        }
        #file-input { 
            display: none; 
        }
        
        /* Personalización sutil del selector de capas nativo de Leaflet */
        .leaflet-control-layers {
            border-radius: 12px !important;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.2) !important;
            border: none !important;
            font-size: 14px;
            padding: 6px 10px !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="panel-botones">
        <label for="file-input" class="btn-ios">📂</label>
        <input type="file" id="file-input" accept=".gpx">
        
        <button class="btn-ios" onclick="localizarUsuario()">📍</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        // 1. Inicializar las dos capas de mapa base disponibles
        const mapaTopografico = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: '© OpenTopoMap'
        });

        const fotoAerea = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Tiles © Esri'
        });

        // 2. Inicializar el mapa con el Topográfico activado por defecto
        const map = L.map('map', { 
            zoomControl: false,
            layers: [mapaTopografico] 
        }).setView([40.4167, -3.7037], 6);

        // 3. Crear y añadir el control para alternar capas en la esquina superior derecha
        const mapasBase = {
            "Mapa de Montaña": mapaTopografico,
            "Foto Aérea (Satélite)": fotoAerea
        };
        L.control.layers(mapasBase, null, { position: 'topright' }).addTo(map);

        let rutaActual = null;

        // 4. Lector de archivos GPX desde el almacenamiento del iPhone
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const gpxData = evt.target.result;

                // Si ya había una ruta cargada en pantalla, la eliminamos
                if (rutaActual) map.removeLayer(rutaActual);

                // Dibujar el nuevo track GPX
                rutaActual = new L.GPX(gpxData, {
                    async: true,
                    polyline_options: {
                        color: '#ff3b30', // Rojo iOS
                        weight: 5,
                        opacity: 0.85
                    },
                    marker_options: {
                        startIconUrl: null, // Desactivados para evitar problemas de carga sin cobertura
                        endIconUrl: null,
                        shadowUrl: null
                    }
                }).on('loaded', function(e) {
                    map.fitBounds(e.target.getBounds()); // Auto-zoom para encuadrar la ruta completa
                }).addTo(map);
            };
            reader.readAsText(file);
        });

        // 5. Función de geolocalización GPS en tiempo real
        let userMarker;
        function localizarUsuario() {
            if (!navigator.geolocation) return alert("El GPS no está disponible en este dispositivo");
            
            navigator.geolocation.getCurrentPosition(function(pos) {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                
                if (userMarker) {
                    userMarker.setLatLng([lat, lng]);
                } else {
                    userMarker = L.circleMarker([lat, lng], { 
                        radius: 9, 
                        fillColor: '#007aff', // Azul GPS Apple
                        color: 'white', 
                        weight: 2, 
                        fillOpacity: 1 
                    }).addTo(map);
                }
                map.setView([lat, lng], 15);
            }, function(err) { 
                alert("Error al obtener la ubicación. Asegúrate de dar permisos de GPS a Safari."); 
            }, { 
                enableHighAccuracy: true // Obliga al iPhone a usar el GPS real de alta precisión
            });
        }

        // 6. Registro del Service Worker para funcionamiento Offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado correctamente', reg))
                    .catch(err => console.error('Error al registrar el Service Worker', err));
            });
        }
    </script>
</body>
</html>
