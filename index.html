<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GPS Orientado Pro - Offline Mapas</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest"
        href="data:application/manifest+json,{%22name%22:%22GPS%20Giro%22,%22short_name%22:%22GPSGiro%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22}">

    <link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, system-ui, sans-serif;
            background-color: #000;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        /* BARRA DE BOTONES: Estilo Dock iOS flotante en la parte inferior */
        .panel-botones {
            position: absolute;
            bottom: calc(12px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            flex-direction: row;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            padding: 8px 12px;
            border-radius: 30px;
            box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: max-content;
        }

        .btn-ios {
            background: rgba(0, 0, 0, 0.05);
            border: none;
            border-radius: 50%;
            font-size: 20px;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
        }

        .btn-ios:active {
            transform: scale(0.9);
        }

        .btn-ios svg {
            width: 22px;
            height: 22px;
            stroke-width: 2;
        }

        .btn-activo {
            background: #007aff !important;
            color: white !important;
        }

        .input-oculto {
            display: none;
        }

        /* HUD INFORMATIVO: Centrado y flotando justo encima de los botones */
        .hud-ruta {
            position: absolute;
            bottom: calc(82px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.96);
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            padding: 12px 16px;
            border-radius: 18px;
            box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.2);
            font-size: 13px;
            color: #222;
            display: none;
            line-height: 1.4;
            border: 1px solid rgba(0, 0, 0, 0.06);
            width: calc(100% - 32px);
            max-width: 380px;
            box-sizing: border-box;
        }

        /* GRÁFICO DE ALTITUD: Estilo "Bottom Sheet" deslizable desde abajo */
        .panel-altitud {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: calc(260px + env(safe-area-inset-bottom));
            background: rgba(255, 255, 255, 0.97);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            z-index: 30;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 24px 24px 0 0;
            box-shadow: 0px -8px 24px rgba(0, 0, 0, 0.15);
            transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 14px 16px calc(14px + env(safe-area-inset-bottom)) 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .panel-altitud.abierto {
            bottom: 0;
        }

        .cabecera-altitud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .btn-cerrar {
            background: rgba(0, 0, 0, 0.06);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contenedor-grafico {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Flecha GPS */
        .gpx-flecha-usuario {
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 28px solid #007aff;
            filter: drop-shadow(0px 4px 4px rgba(0, 0, 0, 0.4));
            transition: transform 0.1s linear;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div id="hud-ruta" class="hud-ruta"></div>

    <div id="panel-altitud" class="panel-altitud">
        <div class="cabecera-altitud">
            <span style="font-weight: 600; color: #222; font-size: 15px;">Perfil de Altitud</span>
            <button class="btn-cerrar" onclick="alternarPanelAltitud()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="contenedor-grafico">
            <canvas id="graficoAltitud"></canvas>
        </div>
    </div>

    <div class="panel-botones">
        <button class="btn-ios" id="btn-capa" onclick="alternarCapa()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m8 3 4 8 5-5 5 15H2L8 3z" />
            </svg>
        </button>
        <button class="btn-ios" id="btn-altitud" onclick="alternarPanelAltitud()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20V10" />
                <path d="M18 20V4" />
                <path d="M6 20v-4" />
            </svg>
        </button>

        <label for="file-input" class="btn-ios">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" x2="12" y1="3" y2="15" />
            </svg>
        </label>
        <input type="file" id="file-input" class="input-oculto" accept=".gpx">

        <label for="map-input" class="btn-ios" id="label-mapa">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21" />
                <line x1="9" x2="9" y1="3" y2="18" />
                <line x1="15" x2="15" y1="6" y2="21" />
            </svg>
        </label>
        <input type="file" id="map-input" class="input-oculto" accept=".pmtiles">

        <button class="btn-ios" id="btn-brujula" onclick="conmutarModoSeguimiento()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
            </svg>
        </button>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>

    <script src="./app.js"></script>
</body>

</html>
